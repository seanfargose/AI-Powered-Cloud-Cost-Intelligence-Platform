version: "3.8"

# Local dev services only (Postgres + Redis).
# Run with: docker-compose up -d
# The Node apps themselves still run via `npm run dev:full` on the host,
# they are not containerized here.

services:
  postgres:
    image: postgres:13-alpine
    container_name: cost-opt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cost_optimization
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - cost-opt-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6-alpine
    container_name: cost-opt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cost-opt-postgres-data:
